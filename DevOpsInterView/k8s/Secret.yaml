apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
type: Opaque
data:
  DB_USER: YmFkaG9u # echo -n "badhon" | base64
  DB_PASSWORD: dGVzdG5ldA== # echo -n "testnet" | base64
---
apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          memory: "100Mi"
          cpu: "300m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      ports:
        - containerPort: 80
      env:
        - name: APP
          valueFrom:
            configMapKeyRef:
              name: frontend-secret
              key: DB_USER
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: frontend-secret
              key: DB_PASSWORD
